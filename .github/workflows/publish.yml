name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v4
        with:
          node-version: 26.7.0
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest

      - name: Assert release tag matches the checked-out commit
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ -z "$RELEASE_TAG" ]; then
            echo "Release tag is empty." >&2
            exit 1
          fi
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse "$RELEASE_TAG^{commit}")" ]; then
            echo "Release tag does not point at the checked-out commit." >&2
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set version from release tag
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: npm version "${RELEASE_TAG#v}" --no-git-tag-version --allow-same-version --ignore-scripts

      - name: Typecheck
        run: |
          bun run typecheck
          bun run typecheck:desktop

      - name: Build Desktop bundle
        run: bun run build

      - name: Verify tarball contents
        run: |
          test -f dist/gui-experimental.cjs
          npm pack --dry-run --ignore-scripts

      - name: Publish to npm
        run: npm publish --access public --provenance --ignore-scripts

      - name: Checkout main for version bump
        if: github.event_name == 'release'
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Commit and push version bump
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          npm version "${RELEASE_TAG#v}" --no-git-tag-version --allow-same-version --ignore-scripts
          git add package.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: release v${RELEASE_TAG#v}"
          git push origin HEAD:main
